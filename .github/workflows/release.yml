name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Verify release version
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("plugins/pilot/.codex-plugin/plugin.json"))["version"])')"
          expected_tag="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
      - name: Build plugin archive
        run: scripts/package-plugin "dist/pilot-${GITHUB_REF_NAME}.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "dist/pilot-${GITHUB_REF_NAME}.zip"
          --verify-tag
          --generate-notes
          --title "Pilot ${GITHUB_REF_NAME#v}"
